<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline Librarian</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%231f6f5c%22/%3E%3Cpath d=%22M4 4h3v8H4zM8 4h4v2H8zm0 3h4v2H8z%22 fill=%22white%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
    --accent: #1f6f5c; --accent-ink: #ffffff; --chip: #e8f1ee; --mark: #fff1b8; --warn: #9a3412;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a2a097; --line: #34332f;
            --accent: #5fb89f; --accent-ink: #0d1f1a; --chip: #23332e; --mark: #5c4d10; --warn: #fb923c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI",
         Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  #status { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #menu { display: none; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
           border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #layout { flex: 1; display: flex; min-height: 0; }
  nav { width: 270px; border-right: 1px solid var(--line); background: var(--panel); display: flex;
        flex-direction: column; min-height: 0; }
  nav .top { padding: 12px; border-bottom: 1px solid var(--line); }
  nav ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; }
  nav li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  nav li:hover, nav li.current { background: var(--chip); }
  nav li small { display: block; color: var(--muted); font-size: 12px; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .column { max-width: 780px; margin: 0 auto; }
  .question { background: var(--chip); border-radius: 12px; padding: 10px 14px; margin: 18px 0 10px; }
  .answer { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px 12px; }
  .answer h1, .answer h2, .answer h3, .answer h4 { font-size: 16px; margin: 14px 0 6px; }
  .answer p { margin: 10px 0; }
  .answer ul, .answer ol { padding-left: 22px; }
  .note { color: var(--muted); font-size: 14px; padding: 8px 2px; }
  .error { color: var(--warn); }
  a.cite { display: inline-block; min-width: 1.4em; text-align: center; font-size: 12px; font-weight: 600;
           background: var(--chip); color: var(--accent); border-radius: 6px; padding: 0 4px; margin: 0 1px;
           text-decoration: none; cursor: pointer; vertical-align: 1px; }
  .sources { margin-top: 10px; font-size: 14px; }
  .sources details { margin-top: 6px; }
  .sources summary { color: var(--muted); cursor: pointer; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 8px 0;
          background: var(--panel); cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card .meta { font-size: 12px; color: var(--muted); }
  .card .title { font-weight: 600; }
  .card .snippet { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3;
                   -webkit-box-orient: vertical; overflow: hidden; }
  form { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px
         calc(10px + env(safe-area-inset-bottom)); }
  form .column { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; font: inherit; resize: none; border: 1px solid var(--line); border-radius: 10px;
             padding: 9px 12px; min-height: 44px; max-height: 180px; background: var(--bg); color: var(--ink); }
  #reader { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; padding: 24px; z-index: 10; }
  #reader.open { display: block; }
  #reader .sheet { max-width: 820px; height: 100%; margin: 0 auto; background: var(--panel); border-radius: 14px;
                   display: flex; flex-direction: column; overflow: hidden; }
  #reader .bar { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px;
                 border-bottom: 1px solid var(--line); }
  #reader .bar div { flex: 1; min-width: 0; }
  #reader h2 { font-size: 18px; margin: 0; }
  #reader .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  #article { overflow-y: auto; padding: 4px 18px 24px; }
  #article .part.focus { background: var(--mark); border-radius: 8px; padding: 2px 10px; margin: 0 -10px; }
  #article h3 { font-size: 16px; margin: 16px 0 4px; }
  #empty { color: var(--muted); text-align: center; padding: 40px 10px; }
  @media (max-width: 760px) {
    #menu { display: inline-block; }
    nav { position: fixed; top: 0; bottom: 0; left: 0; z-index: 5; transform: translateX(-100%);
          transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.25); }
    nav.open { transform: none; }
    #reader { padding: 0; }
    #reader .sheet { border-radius: 0; }
    header h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <button id="menu" type="button" aria-label="Conversations">☰</button>
  <h1>Offline Librarian</h1>
  <span id="status"></span>
</header>
<div id="layout">
  <nav id="nav">
    <div class="top"><button id="new" class="primary" type="button">New conversation</button></div>
    <ul id="conversations"></ul>
  </nav>
  <main>
    <div id="messages"><div class="column" id="thread">
      <div id="empty">Ask a question, and the answer comes from the library, with its sources.<br>
        <b>Search only</b> lists matching passages without the AI.</div>
    </div></div>
    <form id="form">
      <div class="column">
        <textarea id="question" rows="1" placeholder="Ask the library…" autofocus></textarea>
        <button id="search" type="button">Search only</button>
        <button id="ask" class="primary" type="submit">Ask</button>
      </div>
    </form>
  </main>
</div>
<div id="reader" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="bar"><div><h2 id="reader-title"></h2><div class="meta" id="reader-meta"></div></div>
      <button id="close" type="button">Close</button></div>
    <div id="article"></div>
  </div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
let conversation = null, busy = false;

function escape(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

// A small Markdown subset: headings, lists, bold, italics, code and citations like [2] or [1, 3].
// Everything is escaped first, so nothing in an answer or article can become markup.
function inline(text, passages) {
  let html = escape(text)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  if (passages) {
    html = html.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (whole, group) => group.split(",").map((n) => {
      const number = Number(n.trim()), passage = passages.find((p) => p.n === number);
      return passage ? `<a class="cite" data-passage="${passage.id}" title="${escape(passage.title)}">${number}</a>`
                     : `[${number}]`;
    }).join(""));
  }
  return html;
}

function markdown(text, passages) {
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { close(); continue; }
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { close(); out.push(`<h${Math.min(m[1].length + 1, 4)}>${inline(m[2], passages)}</h${Math.min(m[1].length + 1, 4)}>`); continue; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) { close(); out.push("<hr>"); continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1], passages)}</li>`); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1], passages)}</li>`); continue; }
    close();
    out.push(`<p>${inline(line, passages)}</p>`);
  }
  close();
  return out.join("");
}

async function json(path, options) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || `The server answered ${response.status}.`);
  return body;
}

async function loadStatus() {
  try {
    const s = await json("/api/status");
    let meaning = "";
    if (s.embedded && s.to_embed) meaning = ` · meaning index ${Math.floor(100 * s.embedded / (s.embedded + s.to_embed))}%`;
    else if (s.embedded) meaning = " · meaning index ready";
    $("status").textContent = `${s.articles.toLocaleString()} articles${meaning} · ${s.model}`;
  } catch (error) { $("status").textContent = error.message; }
}

async function loadConversations() {
  const list = await json("/api/conversations").catch(() => []);
  $("conversations").innerHTML = list.map((c) => `<li data-id="${c.id}" class="${c.id === conversation ? "current" : ""}">
    ${escape(c.title)}<small>${escape(new Date(c.updated).toLocaleString())}</small></li>`).join("");
}

function card(passage, number) {
  const heading = passage.heading && passage.heading !== passage.title ? ` › ${escape(passage.heading)}` : "";
  const snippet = passage.text.replace(/^#+\s.*$/gm, "").replace(/\s+/g, " ").trim().slice(0, 300);
  return `<div class="card" data-passage="${passage.id}"><div class="title">${number ? number + ". " : ""}${escape(passage.title)}${heading}</div>
    <div class="meta">${escape(passage.source)}</div><div class="snippet">${escape(snippet)}</div></div>`;
}

function sourcesHtml(passages, cited) {
  if (!passages.length) return "";
  const used = passages.filter((p) => cited.includes(p.n)), rest = passages.filter((p) => !cited.includes(p.n));
  let html = '<div class="sources">';
  if (used.length) html += `<b>Sources</b>${used.map((p) => card(p, p.n)).join("")}`;
  if (rest.length) html += `<details><summary>${used.length ? "Other passages it read" : "Passages it read"} (${rest.length})</summary>${rest.map((p) => card(p, p.n)).join("")}</details>`;
  return html + "</div>";
}

function addTurn(question) {
  $("empty")?.remove();
  const turn = document.createElement("div");
  turn.innerHTML = `<div class="question">${escape(question)}</div><div class="answer"><div class="note">Searching the library…</div></div>`;
  $("thread").appendChild(turn);
  turn.scrollIntoView({block: "start"});
  return turn.querySelector(".answer");
}

function showConversation(saved) {
  $("thread").innerHTML = "";
  for (let i = 0; i < saved.messages.length; i += 2) {
    const asked = saved.messages[i], answered = saved.messages[i + 1];
    const box = addTurn(asked.content);
    box.innerHTML = answered ? markdown(answered.content, answered.passages) + sourcesHtml(answered.passages, answered.cited)
                             : '<div class="note">No answer was saved.</div>';
  }
  if (!saved.messages.length) $("thread").innerHTML = '<div id="empty">This conversation is empty.</div>';
}

async function ask(question) {
  const box = addTurn(question);
  let passages = [], text = "";
  const response = await fetch("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
                                            body: JSON.stringify({question, conversation})});
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    box.innerHTML = `<div class="note error">${escape(body.error || "The server couldn't answer.")}</div>`;
    return;
  }
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const {value, done} = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, {stream: true});
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const chunk = buffer.slice(0, cut);
      buffer = buffer.slice(cut + 2);
      if (!chunk.startsWith("data: ")) continue;
      const event = JSON.parse(chunk.slice(6));
      if (event.type === "conversation") conversation = event.id;
      else if (event.type === "passages") {
        passages = event.passages;
        box.innerHTML = `<div class="note">${passages.length ? `Found ${passages.length} passages; answering…` : "The library found nothing; answering…"}${event.search_problem ? "<br>" + escape(event.search_problem) : ""}</div>`;
      } else if (event.type === "thinking") box.innerHTML = '<div class="note">Thinking…</div>';
      else if (event.type === "text") { text += event.text; box.innerHTML = markdown(text, passages); }
      else if (event.type === "done") box.innerHTML = markdown(event.answer, passages) + sourcesHtml(passages, event.cited);
      else if (event.type === "error") box.innerHTML = markdown(text, passages) + `<div class="note error">${escape(event.message)}</div>`;
    }
  }
}

async function searchOnly(question) {
  const box = addTurn(question);
  box.previousElementSibling.textContent = `Search: ${question}`;
  try {
    const found = await json("/api/search?q=" + encodeURIComponent(question));
    box.innerHTML = (found.problem ? `<div class="note">${escape(found.problem)}</div>` : "") +
      (found.passages.length ? found.passages.map((p, i) => card(p, i + 1)).join("") : '<div class="note">Nothing in the library matches that.</div>');
  } catch (error) { box.innerHTML = `<div class="note error">${escape(error.message)}</div>`; }
}

async function openArticle(passageId) {
  try {
    const a = await json("/api/article?passage=" + passageId);
    $("reader-title").textContent = a.title;
    $("reader-meta").innerHTML = `${escape(a.source)}${a.url ? " · " + escape(a.url) : ""}<br>License: ${escape(a.license)}`;
    $("article").innerHTML = a.passages.map(([id, start, end]) =>
      `<div class="part${id === a.passage ? " focus" : ""}" data-id="${id}">${markdown(a.text.slice(start, end)).replace(/<h(\d)>/g, "<h3>").replace(/<\/h\d>/g, "</h3>")}</div>`).join("");
    $("reader").classList.add("open");
    $("article").querySelector(".focus")?.scrollIntoView({block: "center"});
  } catch (error) { alertBox(error.message); }
}

function alertBox(message) {
  const note = document.createElement("div");
  note.className = "note error";
  note.textContent = message;
  $("thread").appendChild(note);
}

async function submit(kind) {
  const question = $("question").value.trim();
  if (!question || busy) return;
  busy = true;
  for (const id of ["ask", "search"]) $(id).disabled = true;
  $("question").value = "";
  try { await (kind === "ask" ? ask(question) : searchOnly(question)); }
  catch (error) { alertBox(error.message); }
  finally {
    busy = false;
    for (const id of ["ask", "search"]) $(id).disabled = false;
    loadConversations();
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); submit("ask"); });
$("search").addEventListener("click", () => submit("search"));
$("question").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit("ask"); }
});
$("question").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = e.target.scrollHeight + "px"; });
document.addEventListener("click", (e) => {
  const target = e.target.closest("[data-passage]");
  if (target) openArticle(target.dataset.passage);
});
$("close").addEventListener("click", () => $("reader").classList.remove("open"));
$("reader").addEventListener("click", (e) => { if (e.target === $("reader")) $("reader").classList.remove("open"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("reader").classList.remove("open"); });
$("menu").addEventListener("click", () => $("nav").classList.toggle("open"));
$("new").addEventListener("click", () => {
  conversation = null;
  $("thread").innerHTML = '<div id="empty">Ask a question, and the answer comes from the library, with its sources.</div>';
  $("nav").classList.remove("open");
  loadConversations();
  $("question").focus();
});
$("conversations").addEventListener("click", async (e) => {
  const item = e.target.closest("li");
  if (!item) return;
  try {
    const saved = await json("/api/conversations/" + item.dataset.id);
    conversation = saved.id;
    showConversation(saved);
    $("nav").classList.remove("open");
    loadConversations();
  } catch (error) { alertBox(error.message); }
});

loadStatus();
loadConversations();
setInterval(loadStatus, 60000);
</script>
</body>
</html>
