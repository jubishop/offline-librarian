name: Repository checks

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # uv installs the Python that .python-version names; see docs/development-workflow.md for its pin.
      - uses: astral-sh/setup-uv@v10
      - name: Install ShellCheck and pdftotext
        run: sudo apt-get update && sudo apt-get install --yes shellcheck poppler-utils
      - name: Set up the application
        run: bin/setup-application
      - name: Check repository
        run: bin/check --full
