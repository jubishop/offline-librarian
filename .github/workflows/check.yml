name: Repository checks

on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # setup-uv publishes only exact version tags (v10.3.2 and so on), so install the latest uv directly.
      # uv then installs the Python that .python-version names; see docs/development-workflow.md for its pin.
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install ShellCheck and pdftotext
        run: sudo apt-get update && sudo apt-get install --yes shellcheck poppler-utils
      - name: Set up the application
        run: bin/setup-application
      - name: Check repository
        run: bin/check --full
